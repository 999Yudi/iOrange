<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login">
        <div class="forma">

            <h1 class="forma-titulo">REGISTRO E LOGIN</h1>

            <form onsubmit="return false;">
                <div class="info">
                    <label>NOME</label>
                    <input type="text" placeholder="Digite seu nome">
                </div>

                <div class="info">
                    <label>EMAIL</label>
                    <input type="email" placeholder="email@exemplo.com">
                </div>

                <div class="info">
                    <label>SENHA</label>
                    <input type="password" placeholder="Digite sua senha">
                </div>

                <div class="info">
                    <label>CPF</label>
                    <input type="text" placeholder="000.000.000-00">
                </div>

                <button type="button" class="botao" onclick="window.location.href='inicial.html'">
                    ENTRAR / REGISTRAR
                </button>

            </form>
        </div>
    </main>

</body>

</html>
